<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= projectName %> - Admin</title>
    <style>
      #app-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #0b0b10;
        transition: opacity 0.45s ease;
      }
      #app-loader.app-loader-hidden { opacity: 0; pointer-events: none; }
      .app-loader-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .app-loader-logo { position: relative; }
      .app-loader-logo svg { display: block; }
      .app-loader-ring {
        position: absolute; inset: -12px; border-radius: 24px;
        border: 3px solid rgba(96, 165, 250, 0.18);
        border-top-color: #60a5fa;
        animation: app-loader-spin 1s linear infinite;
      }
      .app-loader-title { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.05em; font-family: 'Poppins', sans-serif; }
      .app-loader-sub { color: rgba(255, 255, 255, 0.4); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; font-family: 'Poppins', sans-serif; }
      .app-loader-dots { display: flex; gap: 8px; }
      .app-loader-dots span { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #3b82f6); animation: app-loader-bounce 1.2s ease-in-out infinite; }
      .app-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .app-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes app-loader-spin { to { transform: rotate(360deg); } }
      @keyframes app-loader-bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .app-loader-ring, .app-loader-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true">
      <div class="app-loader-inner">
        <div class="app-loader-logo">
          <svg width="62" height="62" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="boot-logo-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#60a5fa" />
                <stop offset="100%" stop-color="#3b82f6" />
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#boot-logo-g)" />
            <path d="M22 42 V22 L32 34 L42 22 V42" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="app-loader-ring"></div>
        </div>
        <div style="text-align: center;">
          <div class="app-loader-title">Loading Admin Panel</div>
          <div class="app-loader-sub">Preparing your workspace</div>
        </div>
        <div class="app-loader-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
